<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Редагування</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="mb-4">Редагувати нотатку</h2>
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <form th:action="@{/note/edit}" method="post">
            <input type="hidden" name="id" th:value="${note.id}">

            <div class="mb-3">
              <label class="form-label text-muted">Назва</label>
              <input type="text" name="title" class="form-control" th:value="${note.title}" required>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted">Контент</label>
              <textarea name="content" class="form-control" rows="4" required th:text="${note.content}"></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary w-50">Зберегти</button>
              <a th:href="@{/note/list}" class="btn btn-secondary w-50">Скасувати</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
